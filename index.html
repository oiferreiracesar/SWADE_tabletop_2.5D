<!DOCTYPE html>
<html>
<head>
    <title>Laboratório de Telhado 3D</title>
    <style>
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; flex-direction: column;}
        canvas { border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h2>Rampa Diagonal Isolada (Quina do Octógono)</h2>
    <canvas id="sandbox" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        const tw = 128;  // Largura do tile
        const th = 64;   // Altura do tile
        const ox = 200;  // Centro X
        const oy = 250;  // Centro Y (Chão)
        const wallH = 64; // Altura da Parede
        const roofH = 64; // Altura do Telhado (Z)

        // 1. As coordenadas isométricas base do quadrado
        const pN = { x: ox, y: oy - th };
        const pE = { x: ox + tw/2, y: oy - th/2 };
        const pS = { x: ox, y: oy };
        const pW = { x: ox - tw/2, y: oy - th/2 };

        // 2. O CHÃO CORTADO (Tipo 2 - Quina Noroeste do Octógono)
        ctx.fillStyle = 'rgba(100, 200, 100, 0.4)';
        ctx.beginPath();
        ctx.moveTo(pN.x, pN.y); ctx.lineTo(pE.x, pE.y); ctx.lineTo(pW.x, pW.y);
        ctx.closePath(); ctx.fill();

        // 3. A PAREDE DIAGONAL (Liga o Oeste ao Leste)
        ctx.fillStyle = '#c62828';
        ctx.beginPath();
        ctx.moveTo(pW.x, pW.y); 
        ctx.lineTo(pE.x, pE.y); 
        ctx.lineTo(pE.x, pE.y - wallH); // Sobe a parede no Leste
        ctx.lineTo(pW.x, pW.y - wallH); // Sobe a parede no Oeste
        ctx.closePath(); 
        ctx.fill();
        ctx.strokeStyle = '#222'; ctx.stroke();

        // 4. A GEOMETRIA PURA DO TELHADO 3D (A Rampa)
        // Ponto Norte sobe tudo (parede + telhado). Oeste e Leste param na altura exata da parede.
        const rN = { x: pN.x, y: pN.y - wallH - roofH };
        const rE = { x: pE.x, y: pE.y - wallH };
        const rW = { x: pW.x, y: pW.y - wallH };

        ctx.fillStyle = '#475569'; // Cor base do telhado
        ctx.beginPath();
        ctx.moveTo(rN.x, rN.y);
        ctx.lineTo(rE.x, rE.y);
        ctx.lineTo(rW.x, rW.y);
        ctx.closePath();
        ctx.fill();

        // Simulação do Shader de Luz (Bate na inclinação)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; 
        ctx.fill();
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();

        // Pontos de marcação para você visualizar os vértices
        ctx.fillStyle = 'yellow';
        ctx.fillRect(rN.x - 3, rN.y - 3, 6, 6); // Topo (Pico)
        ctx.fillRect(rE.x - 3, rE.y - 3, 6, 6); // Quina Direita
        ctx.fillRect(rW.x - 3, rW.y - 3, 6, 6); // Quina Esquerda
    </script>
</body>
</html>
