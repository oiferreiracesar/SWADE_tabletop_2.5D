<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RPG Isométrico - Construtor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h2>Modo Construção</h2>
        
        <div class="tool-section">
            <h3>Ferramentas Básicas</h3>
            <button id="btnPiso" class="tool-btn active">Piso (1)</button>
            <button id="btnParede" class="tool-btn">Parede Flex (2)</button>
            <button id="btnBorracha" class="tool-btn">Borracha (Segure Ctrl)</button>
        </div>

        <div class="tool-section">
            <h3>Cômodos Prontos</h3>
            <button id="btnRoomRect" class="tool-btn">Sala Retangular (3)</button>
            <button id="btnRoomTri" class="tool-btn">Sala Triangular (4)</button>
            <!-- ATUALIZADO: Botão destravado -->
            <button id="btnRoomOct" class="tool-btn">Sala Octogonal (5)</button>
        </div>

        <div class="tool-section">
            <h3>Altura da Parede: <span id="valorAltura">48</span>px</h3>
            <input type="range" id="sliderAltura" min="12" max="120" value="48" style="width: 100%; cursor: pointer;">
        </div>

        <div class="tool-section">
            <h3>Configurações Visuais</h3>
            <button id="btnCutaway" class="action-btn">Paredes: CORTADAS (C)</button>
        </div>

        <div class="tool-section">
            <h3>Controles de Projeto</h3>
            <button id="btnUndo" class="action-btn">Desfazer Ação (Ctrl+Z)</button>
        </div>

        <div id="instructions">
            <p><strong>Arraste o mouse:</strong> Criar linhas/áreas</p>
            <p><strong>Shift + Clique:</strong> Preencher cômodo</p>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
