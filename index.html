<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RPG Isométrico - Construtor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h2>Modo Construção</h2>
        
        <div class="tool-section">
            <h3>Ferramentas Básicas</h3>
            <button id="btnPiso" class="tool-btn active">Piso (1)</button>
            <button id="btnParede" class="tool-btn">Parede Flex (2)</button>
            <button id="btnColuna" class="tool-btn">Coluna (6)</button>
            <button id="btnBorracha" class="tool-btn">Borracha (Segure Ctrl)</button>
        </div>

        <div class="tool-section">
            <h3>Cômodos Prontos</h3>
            <button id="btnRoomRect" class="tool-btn">Sala Retangular (3)</button>
            <button id="btnRoomTri" class="tool-btn">Sala Triangular (4)</button>
            <button id="btnRoomOct" class="tool-btn">Sala Octogonal (5)</button>
        </div>

        <div class="tool-section">
            <h3>Navegação de Andares</h3>
            <div style="display: flex; gap: 5px;">
                <button id="btnFloorDown" style="flex: 1; text-align: center;">↓ Descer</button>
                <button id="btnFloorUp" style="flex: 1; text-align: center;">↑ Subir</button>
            </div>
            <p id="floorLabel" style="font-size: 13px; color: #38bdf8; margin: 8px 0 0 0; font-weight: bold;">
                Andar Atual: Térreo (0)
            </p>
        </div>

        <!-- ATUALIZADO: Gizmos de Altura (Parede e Telhado) -->
        <div class="tool-section">
            <h3>Altura da Parede: <span id="valorAltura">48</span>px</h3>
            <input type="range" id="sliderAltura" min="12" max="120" value="48" style="width: 100%; cursor: pointer;">
        </div>

        <div class="tool-section">
            <h3>Altura do Telhado: <span id="valorRoofPitch">20</span></h3>
            <input type="range" id="sliderRoofPitch" min="0" max="60" value="20" style="width: 100%; cursor: pointer;">
        </div>

        <div class="tool-section">
            <h3>Cores do Cenário</h3>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 13px; color: #ccc; display: flex; justify-content: space-between; align-items: center;">
                    Superfície: 
                    <input type="color" id="colorSurface" value="#1e293b" style="cursor: pointer; width: 40px; height: 24px; padding: 0; border: none;">
                </label>
                <label style="font-size: 13px; color: #ccc; display: flex; justify-content: space-between; align-items: center;">
                    Fundo Subsolo: 
                    <input type="color" id="colorUnderground" value="#0a0705" style="cursor: pointer; width: 40px; height: 24px; padding: 0; border: none;">
                </label>
                <label style="font-size: 13px; color: #ccc; display: flex; justify-content: space-between; align-items: center;">
                    Terra Maciça: 
                    <input type="color" id="colorDirt" value="#1e140f" style="cursor: pointer; width: 40px; height: 24px; padding: 0; border: none;">
                </label>
                <label style="font-size: 13px; color: #ccc; display: flex; justify-content: space-between; align-items: center;">
                    Cor do Telhado: 
                    <input type="color" id="colorRoof" value="#475569" style="cursor: pointer; width: 40px; height: 24px; padding: 0; border: none;">
                </label>
            </div>
        </div>

        <div class="tool-section">
            <h3>Configurações Visuais</h3>
            <button id="btnCutaway" class="action-btn">Paredes: CORTADAS (C)</button>
        </div>

        <div class="tool-section">
            <h3>Controles de Projeto</h3>
            <button id="btnUndo" class="action-btn">Desfazer Ação (Ctrl+Z)</button>
        </div>

        <div id="instructions">
            <p><strong>Arraste o mouse:</strong> Criar linhas/áreas</p>
            <p><strong>Shift + Clique:</strong> Preencher cômodo</p>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
